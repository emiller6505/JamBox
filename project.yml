name: JamBox
options:
  bundleIdPrefix: com.jambox
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

targets:
  JamBox:
    type: application
    platform: macOS
    sources:
      - path: JamBox
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jambox.app
        PRODUCT_NAME: JamBox
        CODE_SIGN_ENTITLEMENTS: JamBox/JamBox.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.3"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: JamBox
    dependencies:
      - framework: AVFoundation.framework
        embed: false
      - framework: Combine.framework
        embed: false
      - framework: SwiftUI.framework
        embed: false
      - framework: MediaPlayer.framework
        embed: false
    scheme:
      testTargets:
        - JamBoxTests
      gatherCoverageData: false

  JamBoxTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JamBoxTests
        excludes:
          - "Fixtures/generate.sh"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jambox.app.tests
        PRODUCT_NAME: JamBoxTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JamBox.app/Contents/MacOS/JamBox"
    dependencies:
      - target: JamBox
