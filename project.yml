name: Jambox
options:
  bundleIdPrefix: com.jambox
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

targets:
  Jambox:
    type: application
    platform: macOS
    sources:
      - path: Jambox
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jambox.app
        CODE_SIGN_ENTITLEMENTS: Jambox/Jambox.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleIconName: AppIcon
    dependencies:
      - framework: AVFoundation.framework
        embed: false
      - framework: Combine.framework
        embed: false
      - framework: SwiftUI.framework
        embed: false
